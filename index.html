<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AP Tech Master - 応用情報テクノロジ完全攻略ラボ＆クエスト</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./css/custom.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Noto Sans JP', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-800 min-h-screen flex flex-col justify-center items-center p-0 md:p-4 select-none">

  <!-- 外側ラッパー（PCではスマホ枠、スマホ実機では全画面） -->
  <div id="device-frame-wrapper" class="w-full flex-1 flex flex-col bg-slate-50 mobile-frame-mode transition-all">
    
    <!-- トップステータスバー＆ヘッダー -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200 px-4 pt-3 pb-2.5 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-black text-sm shadow-sm">
          AP
        </div>
        <div>
          <h1 class="text-xs font-black tracking-tight text-slate-800 flex items-center gap-1">
            <span>Tech Master</span>
            <span class="text-[9px] bg-indigo-50 text-indigo-700 px-1.5 py-0.2 rounded font-bold">応用情報</span>
          </h1>
          <div class="flex items-center gap-1.5 text-[10px]">
            <span id="top-level-badge" class="font-bold text-indigo-600">Lv.1</span>
            <span class="text-slate-300">•</span>
            <span id="top-exp-badge" class="font-mono text-slate-500">140 EXP</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="btn-toggle-frame" class="px-2.5 py-1 text-[11px] font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition" title="画面モード切替">
          <span>🖥️ 全画面</span>
        </button>
      </div>
    </header>

    <!-- メイン動的コンテンツ描画エリア -->
    <main id="main-content" class="flex-1 p-4 overflow-y-auto">
      <!-- ここに各画面が動的にマウントされます -->
    </main>

    <!-- 固定ボトムナビゲーションバー -->
    <nav class="sticky bottom-0 z-40 bg-white/95 backdrop-blur border-t border-slate-200 px-2 py-1.5 flex justify-around items-center safe-area-bottom">
      <button data-tab="lab" class="nav-btn flex-1 py-1 flex flex-col items-center gap-0.5 text-indigo-600 transition">
        <span class="text-lg">🧪</span>
        <span class="text-[10px] font-bold">ラボ</span>
        <span class="nav-indicator w-1 h-1 bg-indigo-600 rounded-full transition-opacity"></span>
      </button>

      <button data-tab="quest" class="nav-btn flex-1 py-1 flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition">
        <span class="text-lg">⚔️</span>
        <span class="text-[10px] font-bold">クエスト</span>
        <span class="nav-indicator w-1 h-1 bg-indigo-600 rounded-full opacity-0 transition-opacity"></span>
      </button>

      <button data-tab="drill" class="nav-btn flex-1 py-1 flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition">
        <span class="text-lg">📝</span>
        <span class="text-[10px] font-bold">ドリル</span>
        <span class="nav-indicator w-1 h-1 bg-indigo-600 rounded-full opacity-0 transition-opacity"></span>
      </button>

      <button data-tab="logic" class="nav-btn flex-1 py-1 flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition">
        <span class="text-lg">📖</span>
        <span class="text-[10px] font-bold">語源・記述</span>
        <span class="nav-indicator w-1 h-1 bg-indigo-600 rounded-full opacity-0 transition-opacity"></span>
      </button>

      <button data-tab="dashboard" class="nav-btn flex-1 py-1 flex flex-col items-center gap-0.5 text-slate-400 hover:text-slate-700 transition">
        <span class="text-lg">👤</span>
        <span class="text-[10px] font-bold">マイ</span>
        <span class="nav-indicator w-1 h-1 bg-indigo-600 rounded-full opacity-0 transition-opacity"></span>
      </button>
    </nav>

  </div>

  <!-- アプリケーションエントリースクリプト -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
